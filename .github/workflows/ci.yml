name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (includes layer import rules)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests (includes level solvability)
        run: npm test
      - name: Build
        run: npm run build
